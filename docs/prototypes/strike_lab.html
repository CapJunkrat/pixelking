<title>PixelKing 视角样机</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
/* Layout: one column; game screen, attacker/victim pickers, a card explaining the resolved reaction, then the rule table. Single dark look on purpose (game screen). */
:root {
  --bg: #12101a;
  --panel: #1c1928;
  --line: #34304a;
  --fg: #ece6d6;
  --muted: #9d97b2;
  --gold: #e0b45c;
  --hl: #2c2740;
  --display: "Silkscreen", ui-monospace, "SF Mono", Menlo, monospace;
  --body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 15px; line-height: 1.6; }
.wrap {
  max-width: 620px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  display: flex; flex-direction: column; gap: 16px;
}
h1 { font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: .04em; margin: 0; color: var(--gold); }
.sub { color: var(--muted); margin: 0; font-size: 14px; }
.screen { position: relative; background: #0b0a11; border: 2px solid var(--line); border-radius: 6px; overflow: hidden; cursor: pointer; }
canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
.hint { position: absolute; right: 8px; bottom: 6px; font-size: 11px; color: var(--muted); pointer-events: none; }
.controls { display: flex; flex-direction: column; gap: 10px; }
.group { display: flex; flex-direction: column; gap: 6px; }
.group .label { color: var(--muted); font-size: 13px; }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; gap: 1px; background: var(--line); }
.seg button { padding: 9px 6px; background: var(--panel); color: var(--muted); border: 0; font: inherit; font-size: 14px; cursor: pointer; min-width: 0; }
.seg button small { display: block; font-size: 11px; opacity: .8; }
.seg button[aria-pressed="true"] { background: var(--gold); color: #1a1408; font-weight: 600; }
.seg button:focus-visible, .replay:focus-visible { outline: 2px solid var(--fg); outline-offset: -3px; }
.row { display: flex; gap: 8px; align-items: stretch; }
.row .seg { flex: 1; }
.replay { padding: 9px 14px; background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; }
.notes { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
.notes h2 { font-size: 16px; margin: 0 0 8px; }
.notes dl { margin: 0; display: grid; grid-template-columns: 4.5em 1fr; gap: 6px 10px; }
.notes dt { color: var(--muted); font-size: 13px; padding-top: 1px; }
.notes dd { margin: 0; min-width: 0; }
.chip { display: inline-block; font-size: 12px; padding: 0 6px; border-radius: 4px; background: var(--hl); color: var(--gold); margin-right: 4px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 420px; }
th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 500; background: var(--panel); }
td.on { background: var(--hl); color: var(--gold); font-weight: 600; }
.rules h2 { font-size: 16px; margin: 0 0 8px; }
.rules p { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
</style>

<div class="wrap">
  <header>
    <h1>PIXELKING · STRIKE LAB</h1>
    <p class="sub">受击动画由“攻击的打击类型 × 受击方体型”决定。任意组合，点画面重播。</p>
  </header>

  <div class="screen" id="screen">
    <canvas id="cv" width="192" height="208" aria-label="棋子攻击与受击动画演示"></canvas>
    <span class="hint">点击重播</span>
  </div>

  <div class="controls">
    <div class="group"><span class="label">攻击方（白）</span>
      <div class="seg" id="segAtk">
        <button type="button" id="a-pawn" data-k="pawn" aria-pressed="false">兵 · 头槌<small>冲击 · 轻</small></button>
        <button type="button" id="a-knight" data-k="knight" aria-pressed="true">马 · L形踏击<small>重压 · 中</small></button>
        <button type="button" id="a-bishop" data-k="bishop" aria-pressed="false">象 · 居合斩<small>斩击 · 中</small></button>
        <button type="button" id="a-rook" data-k="rook" aria-pressed="false">车 · 冲撞<small>冲击 · 重</small></button>
        <button type="button" id="a-queen" data-k="queen" aria-pressed="false">后 · 光枪贯穿<small>穿刺 · 重</small></button>
        <button type="button" id="a-king" data-k="king" aria-pressed="false">王 · 王权裁决<small>重压 · 重</small></button>
      </div>
    </div>
    <div class="group"><span class="label">受击方（黑）</span>
      <div class="seg" id="segVic">
        <button type="button" id="v-pawn" data-k="pawn" aria-pressed="false">兵<small>轻</small></button>
        <button type="button" id="v-knight" data-k="knight" aria-pressed="false">马<small>中</small></button>
        <button type="button" id="v-bishop" data-k="bishop" aria-pressed="false">象<small>中</small></button>
        <button type="button" id="v-rook" data-k="rook" aria-pressed="true">车<small>重</small></button>
        <button type="button" id="v-queen" data-k="queen" aria-pressed="false">后<small>重</small></button>
        <button type="button" id="v-king" data-k="king" aria-pressed="false">王<small>重</small></button>
      </div>
    </div>
    <div class="row">
      <div class="seg" id="segSpeed">
        <button type="button" id="sp-1" data-k="1" aria-pressed="true">正常速度</button>
        <button type="button" id="sp-03" data-k="0.3" aria-pressed="false">慢放 ×0.3</button>
      </div>
      <button type="button" class="replay" id="replay">重播</button>
    </div>
  </div>

  <section class="notes" id="notes" aria-live="polite"></section>

  <section class="rules">
    <h2>受击规则表</h2>
    <div class="table-wrap">
      <table id="ruleTable">
        <thead><tr><th>打击类型</th><th>轻（兵）</th><th>中（马、象）</th><th>重（车、后、王）</th></tr></thead>
        <tbody>
          <tr><th>斩击（象）</th><td data-c="slash-0">粉碎</td><td data-c="slash-1">顺刀光斜切两半</td><td data-c="slash-2">斜切两半（更沉）</td></tr>
          <tr><th>冲击（车撞）</th><td data-c="bluntH-0">高飞击飞</td><td data-c="bluntH-1">低平撞飞</td><td data-c="bluntH-2">拦腰碎裂</td></tr>
          <tr><th>冲击（兵撞）</th><td data-c="bluntL-0">击飞</td><td data-c="bluntL-1">快速翻倒</td><td data-c="bluntL-2">先撬根基，再撞倒</td></tr>
          <tr><th>穿刺（后）</th><td data-c="pierce-0">贯穿击退</td><td data-c="pierce-1">穿孔碎裂</td><td data-c="pierce-2">穿孔碎裂（更慢）</td></tr>
          <tr><th>重压（马、王）</th><td data-c="crush-0">压扁</td><td data-c="crush-1">自上而下压塌</td><td data-c="crush-2">沉入棋盘</td></tr>
        </tbody>
      </table>
    </div>
    <p>冲击类按“攻击方和受击方的体型差”决定：力量越占优，飞得越远；兵撞车这种以小打大，动画要交代兵是怎么赢的。马踩车同样属于以小打大，所以沉得更慢、更吃力。</p>
  </section>
</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const W = cv.width, H = cv.height;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------------- sprites ----------------
  const SPR = {
    knight: ["....oooo....","...obbhbo...","..obbbbhbo..",".obobbbbbbo.","obbbbbbbbbo.","obbbbsbbbbo.",".ooobsbbbbo.","....obbbbbo.","...obbbbbo..","...obbbbbo..","..obbbbbbbo.","..ossssssso.","..ooooooooo.",".obbbbbbbbbo",".ossssssssso",".ooooooooooo"],
    rook: ["ooo.oooo.ooo","obo.obbo.obo","obooobboooho","obbbbbbbbbho","osssssssssso",".obbbbbbbho.",".obbbbbbbho.",".obbbbbbbho.",".obbbbbbbho.",".obbbbbbbho.",".osssssssso.","oobbbbbbbboo","obbbbbbbbbho","osssssssssso","oooooooooooo"],
    bishop: ["....oo....","...obho...","..obbbho..","..obobho..","..obbobo..","..obbbbo..","...obbo...","..oooooo..","...obbo...","...obbo...","..obbbho..",".obbbbbho.",".osssssso.","oooooooooo"],
    pawn: ["...oooo...","..obbhbo..","..obbbbo..","...obbo...","..obbbbo..","...obbo...","...obbo...","..obbbho..",".obbbbbho.",".osssssso.","oooooooooo"],
    queen: ["o..o.oo.o..o","obobobbobobo","obbbbbbbbbho",".obbbbbbbho.",".osssssssso.","..obbbbbho..","..obbbbbho..","...obbbho...","...obbbho...","...obbbho...","..obbbbbho..",".obbbbbbbho.",".osssssssso.","oooooooooooo"],
    king: [".....oo.....","....obho....","...oobbooo..","....obho....","..oooooooo..",".obbbbbbbho.",".obbbbbbbho.","..obbbbbho..","..obbbbbho..","...obbbho...","..obbbbbho..",".obbbbbbbho.",".osssssssso.","oooooooooooo"]
  };
  const PAL = {
    w: { o: "#2a1e2e", b: "#eadfc4", h: "#fff8e6", s: "#b39b76" },
    k: { o: "#0d0a14", b: "#4c4062", h: "#8a7aa8", s: "#2c2440" }
  };
  function buildSprite(rows, pal, solid) {
    const w = Math.max(...rows.map(r => r.length)), h = rows.length;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); const pixels = [], set = new Set();
    rows.forEach((r, y) => { for (let x = 0; x < w; x++) {
      const ch = r[x] || '.'; if (ch === '.' || ch === ' ') continue;
      const key = pal[ch] ? ch : 'o';
      g.fillStyle = solid || pal[key]; g.fillRect(x, y, 1, 1);
      pixels.push({ x, y, col: pal[key] }); set.add(x + ',' + y);
    } });
    return { c, w, h, pixels, set };
  }
  const S = {};
  for (const n in SPR) for (const side of ['w', 'k']) { S[n + side] = buildSprite(SPR[n], PAL[side]); S[n + side + '!'] = buildSprite(SPR[n], PAL[side], '#ffffff'); }
  function masked(base, keep) {
    const c = document.createElement('canvas'); c.width = base.w; c.height = base.h;
    const g = c.getContext('2d'); const pixels = []; let sx = 0, sy = 0;
    for (const p of base.pixels) if (keep(p.x, p.y)) { g.fillStyle = p.col; g.fillRect(p.x, p.y, 1, 1); pixels.push(p); sx += p.x; sy += p.y; }
    const n = Math.max(1, pixels.length);
    return { c, w: base.w, h: base.h, pixels, cx: Math.round(sx / n), cy: Math.round(sy / n) };
  }

  // ---------------- projection (2.5D tilt) ----------------
  const V = { cell: 18, pitch: 58 * Math.PI / 180, D: 320, cy: 120, side: 6 };
  const SP = Math.sin(V.pitch), CP = Math.cos(V.pitch);
  function project(X, Y, Z) { const k = V.D / (V.D - (Z * CP + Y * SP)); return { x: W / 2 + X * k, y: V.cy + (Z * SP - Y * CP) * k, k }; }
  const pxToY = px => px / CP;
  const cellW = (gx, gy) => ({ X: (gx - 3.5) * V.cell, Z: (gy - 3.5) * V.cell });

  const clamp01 = u => Math.max(0, Math.min(1, u));
  const lerp = (a, b, u) => a + (b - a) * u;
  const smooth = u => u * u * (3 - 2 * u);
  const easeOut = u => 1 - (1 - u) * (1 - u);
  const easeIn = u => u * u;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const sgn = v => v < 0 ? -1 : 1;

  // ---------------- scene ----------------
  const TARGET = { x: 3, y: 3 };
  const STARTS = { knight: { x: 2, y: 5 }, bishop: { x: 0, y: 6 }, rook: { x: 3, y: 6 }, pawn: { x: 2, y: 4 }, queen: { x: 7, y: 3 }, king: { x: 4, y: 4 } };
  const STATIC = [
    { t: 'pawn', s: 'w', x: 1, y: 6 }, { t: 'pawn', s: 'w', x: 5, y: 6 }, { t: 'pawn', s: 'w', x: 6, y: 6 },
    { t: 'pawn', s: 'w', x: 7, y: 6 }, { t: 'king', s: 'w', x: 4, y: 7 },
    { t: 'pawn', s: 'k', x: 1, y: 1 }, { t: 'pawn', s: 'k', x: 2, y: 1 }, { t: 'pawn', s: 'k', x: 5, y: 1 },
    { t: 'pawn', s: 'k', x: 6, y: 2 }, { t: 'pawn', s: 'k', x: 5, y: 4 }, { t: 'king', s: 'k', x: 4, y: 0 },
  ];
  const WEIGHT = { pawn: 0, knight: 1, bishop: 1, rook: 2, queen: 2, king: 2 };
  const WNAME = ['轻', '中', '重'];
  const VNAME = { pawn: '兵', knight: '马', bishop: '象', rook: '车', queen: '后', king: '王' };
  const HITNAME = { slash: '斩击', blunt: '冲击', crush: '重压', pierce: '穿刺' };
  let atkKey = 'knight', vicKey = 'rook', speed = 1;
  const pawnVar = () => atkKey === 'pawn' && WEIGHT[vicKey] === 2 ? 'U' : 'N';

  // ---------------- runtime state ----------------
  const PRE = 0.45;
  let t, hs, rt, impacted, endHold, shake, punch, flash, parts, sparks, rings, smoke, bodies, trail, fired, R, slash, decals, G, RX, power;

  function geo() {
    const sg = STARTS[atkKey], a = cellW(sg.x, sg.y), b = cellW(TARGET.x, TARGET.y);
    let dx = b.X - a.X, dz = b.Z - a.Z; const L = Math.hypot(dx, dz);
    const pa = project(a.X, 0, a.Z), pb = project(b.X, 0, b.Z);
    const face = Math.abs(pb.x - pa.x) < 2 ? 1 : Math.sign(pb.x - pa.x);
    const cg = Math.abs(TARGET.y - sg.y) === 2 ? { x: sg.x, y: TARGET.y } : { x: TARGET.x, y: sg.y };
    let c = (pb.x - pa.x), s = (pb.y - pa.y); const n = Math.hypot(c, s) || 1; c /= n; s /= n;
    if (Math.abs(s) < .42) s = sgn(s || -1) * .42; if (Math.abs(c) < .42) c = sgn(c || 1) * .42;
    return { a, b, dx: dx / L, dz: dz / L, face, corner: cellW(cg.x, cg.y), slashAng: Math.atan2(s, c) };
  }

  function reset() {
    G = geo();
    t = 0; hs = 0; rt = -1; impacted = false; endHold = 0; shake = 0; punch = 0; flash = 0;
    parts = []; sparks = []; rings = []; smoke = []; bodies = []; trail = []; fired = new Set(); slash = null; decals = [];
    power = WEIGHT[atkKey] >= WEIGHT[vicKey] ? 1 : .45;
    RX = pickReact();
    const base = S[vicKey + 'k'];
    const crack = []; let y = Math.round(base.h * .42);
    for (let x = 0; x < base.w; x++) { crack.push(y); if (Math.random() < .5) y += Math.random() < .5 ? -1 : 1; y = Math.max(4, Math.min(Math.round(base.h * .6), y)); }
    // spider-web cracks spreading from the pierced hole
    const web = [], ox = Math.round(base.w / 2), oy = Math.round(base.h * .5);
    for (let i = 0; i < 7; i++) {
      let a = (i / 7) * Math.PI * 2 + rnd(-.3, .3), x = ox, yy = oy;
      for (let s = 0; s < 16; s++) { a += rnd(-.5, .5); x += Math.cos(a); yy += Math.sin(a); web.push({ x: Math.round(x), y: Math.round(yy), d: s + rnd(0, 2) }); }
    }
    web.sort((p, q) => p.d - q.d);
    R = { split: false, crack, rows: 0, web, wobbleT: -9, rest: null, holed: null };
    renderNotes();
  }

  // ---------------- FX spawners ----------------
  function puff(X, Y, Z, n = 8, big = 1) {
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2;
      smoke.push({ X: X + Math.cos(a) * 3, Y: Y + rnd(0, 6), Z: Z + Math.sin(a) * 3, vx: Math.cos(a) * rnd(10, 30) * big, vy: rnd(5, 25), vz: Math.sin(a) * rnd(10, 30) * big, r: rnd(1.5, 3) * big, age: 0, life: rnd(.3, .55) }); }
  }
  function sparkBurst(X, Y, Z, n, dirX = 0, dirZ = 0, bias = 0, spd = 1) {
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = rnd(70, 160) * spd;
      sparks.push({ X, Y, Z, vx: Math.cos(a) * s + dirX * bias, vy: rnd(20, 110) * spd, vz: Math.sin(a) * s + dirZ * bias, age: 0, life: rnd(.18, .34) }); }
  }
  function ring(X, Z, maxR, life = .38, col = '230,215,180') { rings.push({ X, Z, maxR, age: 0, life, col }); }
  function debris(pixels, ox, oy, X, Y, Z, o = {}) {
    const { vx = 0, vy = 0, vz = 0, rot = 0, spread = 30, every = 1, grav = 260, life = [1, 1.6], radial = 2 } = o;
    pixels.forEach((p, i) => { if (i % every) return;
      const lx = p.x - ox, ly = p.y - oy, c = Math.cos(rot), s = Math.sin(rot), dx = lx * c - ly * s, dy = lx * s + ly * c;
      parts.push({ X: X + dx, Y: Math.max(0, Y - pxToY(dy)), Z, vx: vx + rnd(-spread, spread) + dx * radial, vy: vy + rnd(0, spread * 1.2), vz: vz + rnd(-spread, spread) * .6,
                   col: p.col, life: rnd(life[0], life[1]), age: 0, sz: Math.random() < .25 ? 2 : 1, bounced: 0, g: grav }); });
  }
  function bodyFrom(m, X, Z, opts) {
    return Object.assign({ m, X: X + (m.cx - m.w / 2), Y: pxToY(m.h - 1 - m.cy), Z, vx: 0, vy: 0, vz: 0, rot: 0, vr: 0, grav: 0, age: 0, ox: 0, oy: 0,
                           shatterGround: false, shatterAt: Infinity, jitter: 0, dead: false }, opts);
  }
  function shatterBody(b, pw = 1) {
    debris(b.m.pixels, b.m.cx, b.m.cy, b.X + b.ox, Math.max(0, b.Y - pxToY(b.oy)), b.Z, { vx: b.vx * .4, vy: Math.max(20, b.vy * .2) * pw, vz: b.vz * .4, rot: b.rot, spread: 30 * pw });
    b.dead = true;
  }
  function crackDecal(X, Z, n, len) {
    for (let i = 0; i < n; i++) {
      let a = i / n * Math.PI * 2 + rnd(-.3, .3), x = X, z = Z; const pts = [];
      const L = len * rnd(.55, 1);
      for (let d = 0; d < L; d += 1.5) { a += rnd(-.35, .35); x += Math.cos(a) * 1.5; z += Math.sin(a) * 1.5; pts.push([x, z]); }
      decals.push(pts);
    }
  }

  // ---------------- attackers ----------------
  function vicTopY() {
    const h = S[vicKey + 'k'].h;
    if (!impacted) return pxToY(h);
    return RX.topPx ? pxToY(Math.max(0, RX.topPx(rt))) : 0;
  }
  const ATK = {
    knight: {
      name: "KNIGHT L-STOMP", hit: 'crush', impact: .84, end: 2.6, hitstop: .1, shake: 1.35,
      title: "马 · L形腾跃踏击",
      desc: "原地人立蓄力，跃起后在空中先沿长边飞两格，再折向一格，画出一个“L”；在目标正上方顿一下，马头朝下重重踩落。棋盘被踩出裂纹，扬起一圈尘浪。",
      events: [{ at: .24, fn: () => puff(G.a.X, 2, G.a.Z, 6, .8) },
               { at: .5, fn: () => { const k = G.corner; sparkBurst(k.X, V.cell * 1.9, k.Z, 5, 0, 0, 0, .35); ring(k.X, k.Z, V.cell * .4, .25, '224,180,92'); } }],
      pose(u) {
        const { a, b, face, corner: K } = G, c = V.cell, H1 = c * 1.9, H2 = c * 2.2;
        const o = { X: a.X, Y: 0, Z: a.Z, sp: 'knightw', sx: 1, sy: 1, rot: 0, white: 0, trail: false };
        if (u < 0) return o;
        if (u < .24) { const s = Math.sin(u / .24 * Math.PI / 2); o.rot = -.32 * s * face; o.sx = 1 + .14 * s; o.sy = 1 - .18 * s; return o; }
        if (u < .5) { const q = (u - .24) / .26, st = Math.sin(q * Math.PI); o.X = lerp(a.X, K.X, q); o.Z = lerp(a.Z, K.Z, q); o.Y = H1 * easeOut(q); o.rot = lerp(-.32, -.1, q) * face; o.sy = 1 + .12 * st; o.sx = 1 - .08 * st; o.trail = true; return o; }
        if (u < .66) { const q = (u - .5) / .16, e = smooth(q); o.X = lerp(K.X, b.X, e); o.Z = lerp(K.Z, b.Z, e); o.Y = lerp(H1, H2, q); o.rot = lerp(-.1, .38, e) * face; o.trail = true; return o; }
        o.X = b.X; o.Z = b.Z;

  // ---------------- draw ----------------

  function render() {

    // static pieces (dimmed + see-through while focusing)
    const statics = STATIC.filter(s => !(s.t === 'king' && ((s.s === 'w' && atkKey === 'king') || (s.s === 'k' && vicKey === 'king')))).map(s => ({ s, w: cellW(s.x, s.y) }));
    const attacker = { z: o.Z + .5, f: () => {
      shadow(o.X, o.Z, o.Y, 12);
      ctx.globalCompositeOperation = 'lighter';
      trail.forEach((tr, i) => drawSprite(S[tr.sp + '!'], tr.X, tr.Y, tr.Z, tr.sx, tr.sy, tr.rot, .06 + i * (atkKey === 'bishop' ? .03 : .05)));
      ctx.globalCompositeOperation = 'source-over';
      const lift = u < 0 ? Math.round(1 + Math.sin(performance.now() / 160)) : 0;
      drawSprite(S[o.sp], o.X, o.Y + lift, o.Z, o.sx, o.sy, o.rot);
      if (o.white > 0) drawSprite(S[o.sp + '!'], o.X, o.Y + lift, o.Z, o.sx, o.sy, o.rot, o.white);
      if (o.dizzy) { const hp = project(o.X, pxToY(14), o.Z), tm = performance.now() / 1000 * speed;
        for (let i = 0; i < 3; i++) { const a = tm * 7 + i * 2.1; ctx.fillStyle = i % 2 ? '#fff3b0' : '#e0b45c';
          const sx = Math.round(hp.x + Math.cos(a) * 6), sy = Math.round(hp.y + Math.sin(a) * 2);
          ctx.fillRect(sx, sy - 1, 1, 3); ctx.fillRect(sx - 1, sy, 3, 1); } }
    } };
    if (o.trail && hs <= 0) { trail.push({ ...o }); if (trail.length > (atkKey === 'bishop' ? 12 : 7)) trail.shift(); }
    else if (!o.trail && trail.length) trail.shift();

    const victim = { z: b.Z, f: () => {
      if (!R.split || RX.draw) {
        const white = impacted && rt < .07;
        if (!R.split) shadow(b.X, b.Z, 0, 12);
        if (RX.draw) { if (!R.split) RX.draw(white); }
        else {
          const wob = t - R.wobbleT < .28 ? Math.round(Math.sin((t - R.wobbleT) * 70) * 1.5) : 0;
          const jit = RX.jitter ? Math.round(rnd(-1, 1) * RX.jitter()) : impacted ? Math.round(rnd(-1, 1)) : wob;
          drawSprite(white ? S[vicKey + 'k!'] : (R.rest || base()), b.X + jit, 0, b.Z); RX.overlay();
        }
      }
      for (const bd of bodies) {
        if (bd.Y > pxToY(2)) shadow(bd.X + bd.ox, bd.Z, bd.Y, 9);
        const p = project(bd.X, bd.Y, bd.Z), j = bd.jitter && rt < bd.shatterAt ? Math.round(rnd(-1, 1)) : 0;
        ctx.save(); ctx.translate(Math.round(p.x + bd.ox) + j, Math.round(p.y + bd.oy)); ctx.rotate(bd.rot); ctx.drawImage(bd.m.c, -bd.m.cx, -bd.m.cy);
        if (bd.glow && bd.m.edge) { const a = clamp01(1 - bd.age / .55); ctx.fillStyle = `rgba(255,244,210,${a})`; for (const e of bd.m.edge) ctx.fillRect(e.x - bd.m.cx, e.y - bd.m.cy, 1, 1); }
        ctx.restore();
      }
    } };

    if (!impacted) {
      const items = statics.map(({ s, w }) => ({ z: w.Z, f: () => { shadow(w.X, w.Z, 0, 10); drawSprite(S[s.t + s.s], w.X, 0, w.Z); } }));
      items.push(attacker, victim); items.sort((a, c) => a.z - c.z).forEach(it => it.f());
    } else {
      statics.sort((a, c) => a.w.Z - c.w.Z).forEach(({ s, w }) => { ctx.globalAlpha = 1 - .62 * focus; shadow(w.X, w.Z, 0, 10); drawSprite(S[s.t + s.s], w.X, 0, w.Z); ctx.globalAlpha = 1; });
      if (A.hit === 'crush') { victim.f(); attacker.f(); } else { attacker.f(); victim.f(); }
    }

    for (const p of parts) if (p.Y > .01) { const q = project(p.X, p.Y, p.Z); ctx.globalAlpha = clamp01((p.life - p.age) / .35); ctx.fillStyle = p.col; ctx.fillRect(Math.round(q.x), Math.round(q.y), p.sz, p.sz); }
    ctx.globalAlpha = 1;
    for (const m of smoke) { const q = project(m.X, m.Y, m.Z), a = 1 - m.age / m.life; ctx.fillStyle = `rgba(232,224,204,${.55 * a})`; ctx.beginPath(); ctx.arc(Math.round(q.x), Math.round(q.y), m.r * (1 + m.age / m.life * 1.4), 0, Math.PI * 2); ctx.fill(); }
    for (const s of sparks) { const a = project(s.pX ?? s.X, s.pY ?? s.Y, s.pZ ?? s.Z), c = project(s.X, s.Y, s.Z); pixLine(a.x, a.y, c.x, c.y, `rgba(255,${200 + (Math.random() * 55 | 0)},120,${1 - s.age / s.life})`); }
    if (A.fx) A.fx(o, u);
    if (slash) {
      const q = slash.age / slash.life, bs = base(), c = project(b.X, pxToY(bs.h * .45), b.Z), L = 28 * Math.min(1, slash.age / .06), dx = Math.cos(G.slashAng), dy = Math.sin(G.slashAng);
      ctx.strokeStyle = `rgba(255,255,255,${(1 - q) * .35})`; ctx.lineWidth = 5 * (1 - q) + 1;
      ctx.beginPath(); ctx.moveTo(c.x - dx * L, c.y - dy * L); ctx.lineTo(c.x + dx * L, c.y + dy * L); ctx.stroke();
      pixLine(c.x - dx * L, c.y - dy * L, c.x + dx * L, c.y + dy * L, `rgba(255,255,255,${1 - q})`);
    }
    if (flash > 0) {
      ctx.fillStyle = `rgba(255,250,230,${flash * .9})`; ctx.beginPath(); ctx.arc(imp.x, imp.y, (1 - flash) * 18 + 4, 0, Math.PI * 2); ctx.fill();
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(255,255,255,${flash * .16})`; ctx.fillRect(0, 0, W, H);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.font = "8px Silkscreen, monospace"; ctx.fillStyle = "rgba(236,230,214,.75)";
    ctx.fillText(`${A.name} > ${vicKey.toUpperCase()}`, 6, 12);
    if (hs > 0) { ctx.fillStyle = "rgba(224,180,92,.95)"; ctx.fillText("HIT-STOP", W - 52, 24); }
  }

  // ---------------- UI ----------------
  const notesEl = document.getElementById('notes');
  function renderNotes() {
    const A = ATK[atkKey], wv = WEIGHT[vicKey], rx = RX;
    const under = WEIGHT[atkKey] < wv && rx.underdog && A.hit !== 'blunt' ? `<dt>以小打大</dt><dd>${rx.underdog}</dd>` : '';
    const rowKey = A.hit === 'blunt' ? (WEIGHT[atkKey] === 2 ? 'bluntH' : 'bluntL') : A.hit;
    notesEl.innerHTML = `<h2>${A.title} → ${VNAME[vicKey]}</h2><dl>
      <dt>攻击</dt><dd>${A.desc}</dd>
      <dt>判定</dt><dd><span class="chip">${HITNAME[A.hit]}</span><span class="chip">受击方${WNAME[wv]}</span>→ <b>${rx.name}</b></dd>
      <dt>受击</dt><dd>${rx.desc}</dd>${under}</dl>`;
    document.querySelectorAll('#ruleTable td').forEach(td => td.classList.toggle('on', td.dataset.c === `${rowKey}-${wv}`));
  }
  function bindSeg(id, apply) {
    const seg = document.getElementById(id);
    seg.addEventListener('click', e => { const btn = e.target.closest('button'); if (!btn) return;
      seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === btn))); apply(btn.dataset.k); reset(); });
  }
  bindSeg('segAtk', k => { atkKey = k; });
  bindSeg('segVic', k => { vicKey = k; });
  bindSeg('segSpeed', k => { speed = parseFloat(k); });
  document.getElementById('replay').addEventListener('click', reset);
  document.getElementById('screen').addEventListener('click', reset);

  let last = performance.now();
  function frame(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; step(dt); render(); requestAnimationFrame(frame); }
  reset(); requestAnimationFrame(frame);
})();
</script>
